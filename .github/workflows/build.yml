name: Обновить котировки и приложение

on:
  schedule:
    - cron: "40 22 * * 1-5"   # 22:40 UTC (01:40 по Самаре), после закрытия рынка США
  workflow_dispatch:           # кнопка «Обновить котировки сейчас» в приложении
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/build.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Дата
        id: d
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Котировки за сегодня уже скачаны — при правке приложения не качаем заново
      - name: Кэш данных
        id: cache
        uses: actions/cache@v4
        with:
          path: site/data
          key: data-${{ steps.d.outputs.day }}-${{ github.event_name == 'push' && 'reuse' || github.run_id }}
          restore-keys: |
            data-${{ steps.d.outputs.day }}-
            data-
      - name: Скачать котировки и построить структуры
        if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: python scripts/update_data.py --out site/data
      - name: Сохранить данные в кэш
        if: github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: data-${{ steps.d.outputs.day }}-reuse-${{ github.run_id }}
      - name: Собрать сайт
        run: |
          cp -r app/* site/
          python scripts/make_icons.py site
          mkdir -p site/vendor && cd /tmp
          npm pack lightweight-charts@4.1.3 --silent
          tar xzf lightweight-charts-4.1.3.tgz
          cp package/dist/lightweight-charts.standalone.production.js "$GITHUB_WORKSPACE/site/vendor/"
          cp package/LICENSE "$GITHUB_WORKSPACE/site/vendor/LICENSE-lightweight-charts.txt"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
